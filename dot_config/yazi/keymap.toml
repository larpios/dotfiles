[[mgr.prepend_keymap]]
desc = "run jjui"
on = ["g", "j"]
run = "plugin jjui"

[[mgr.prepend_keymap]]
desc = "Enter the child directory, or open the file"
on = "l"
run = "plugin smart-enter"

[[mgr.prepend_keymap]]
on   = "<C-d>"
run  = "plugin diff"
desc = "Diff the selected with the hovered file"

[[mgr.prepend_keymap]]
desc = "sudo paste"
on = ["R", "p", "p"]
run = "plugin sudo -- paste"

[[mgr.prepend_keymap]]
desc = "sudo paste"
on = ["R", "P"]
run = "plugin sudo -- paste --force"

[[mgr.prepend_keymap]]
desc = "sudo rename"
on = ["R", "r"]
run = "plugin sudo -- rename"

[[mgr.prepend_keymap]]
desc = "sudo link"
on = ["R", "p", "l"]
run = "plugin sudo -- link"

[[mgr.prepend_keymap]]
desc = "sudo link relative path"
on = ["R", "p", "r"]
run = "plugin sudo -- link --relative"

[[mgr.prepend_keymap]]
desc = "sudo hardlink"
on = ["R", "p", "L"]
run = "plugin sudo -- hardlink"

[[mgr.prepend_keymap]]
desc = "sudo create"
on = ["R", "a"]
run = "plugin sudo -- create"

[[mgr.prepend_keymap]]
desc = "sudo trash"
on = ["R", "d"]
run = "plugin sudo -- remove"

[[mgr.prepend_keymap]]
desc = "sudo delete"
on = ["R", "D"]
run = "plugin sudo -- remove --permanently"

[[mgr.prepend_keymap]]
desc = "sudo chmod"
on = ["R", "m"]
run = "plugin sudo -- chmod"

[[mgr.prepend_keymap]]
on   = "F"
run  = "plugin smart-filter"
desc = "Smart filter"

[[mgr.prepend_keymap]]
on = ["C"]
run = "plugin ouch"
desc = "Compress with ouch"
